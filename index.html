<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
</head>

<body>

    <div class="container">

        <select id="lang-select-fixed" onchange="app.changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="es">Español</option>
            <option value="hi">हिन्दी</option>
            <option value="fr">Français</option>
        </select>

        <div id="intro-screen">
            <h1 data-i18n="app_title"></h1>
            <h3 data-i18n="app_subtitle"></h3>

            <div class="instruction-box">
                <p><strong data-i18n="instructions_title"></strong> <span data-i18n="instructions_text"></span></p>
                <p><strong data-i18n="time_text"></strong></p>
                <hr>

                <div class="form-group">
                    <label for="user-age" data-i18n="age_label"></label>
                    <select id="user-age">
                        <option value="88" data-i18n="age_14_15"></option>
                        <option value="94" data-i18n="age_16_17"></option>
                        <option value="100" data-i18n="age_18_30"></option>
                        <option value="97" data-i18n="age_31_35"></option>
                        <option value="93" data-i18n="age_36_40"></option>
                        <option value="88" data-i18n="age_41_45"></option>
                        <option value="82" data-i18n="age_46_50"></option>
                        <option value="76" data-i18n="age_51_55"></option>
                        <option value="70" data-i18n="age_56_plus"></option>
                    </select>
                </div>
            </div>
            <button class="btn" onclick="app.startTest()" data-i18n="start_btn"></button>
        </div>

        <div id="test-screen" class="hidden">
            <div class="test-wrapper">
                <div class="timer-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"
                    aria-label="Time remaining">
                    <div class="timer-progress" id="timer-bar-fill"></div>
                </div>

                <div class="progress-info" id="progress-container"></div>

                <div class="question-area">
                    <img id="q-image" class="question-image" alt="Matrix Question">
                </div>

                <div class="options-grid" id="options-container" role="radiogroup" aria-label="Answer options"></div>
                <div class="keyboard-hint" data-i18n="keyboard_hint"
                    style="font-size:0.7rem;color:var(--muted-text);letter-spacing:0.05rem;margin-bottom:0.6rem;opacity:0.8">
                </div>

                <div class="nav-controls">
                    <button class="btn" id="btn-prev" onclick="app.prevQuestion()" aria-label="Previous">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        <span data-i18n="btn_prev"></span>
                    </button>
                    <button class="btn btn-cancel btn-end-warning" onclick="app.confirmEndTest()" aria-label="End test">
                        <span data-i18n="btn_end"></span>
                    </button>
                    <button class="btn" id="btn-next" onclick="app.nextQuestion()" aria-label="Next">
                        <span data-i18n="btn_next"></span>
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="result-screen" class="hidden">
            <div class="results-v2">
                <div class="hero-card">
                    <h3 data-i18n="result_label"></h3>
                    <div class="score-hero">
                        <span class="score-big" id="final-iq">--</span>
                    </div>
                    <div class="diagnosis-text" id="final-diagnosis">--</div>
                    <div class="percentile-badge"><span data-i18n="percentile_label"></span> <strong id="final-percentile">--</strong></div>

                    <div class="stats-container">
                        <div class="stat-group">
                            <span class="stat-label" data-i18n="total_score_label"></span>
                            <span class="stat-value" id="total-raw-score"></span>
                        </div>
                        <div class="stat-group">
                            <span class="stat-label" data-i18n="time_taken_label"></span>
                            <span class="stat-value" id="time-taken"></span>
                        </div>
                        <div class="stat-group">
                            <span class="stat-label" data-i18n="result_age_label"></span>
                            <span class="stat-value" id="user-age-val"></span>
                        </div>
                    </div>

                    <div class="bell-section">
                        <h4 class="bell-title" data-i18n="bell_label"></h4>
                        <div id="bell-wrap"></div>
                    </div>

                    <div class="hero-actions">
                        <button class="btn btn-primary" onclick="app.shareResults()" data-i18n="share_btn"></button>
                        <button class="btn" onclick="app.downloadPDF()" data-i18n="download_btn"></button>
                        <button class="btn btn-cancel" onclick="app.resetApp()" data-i18n="return_btn"></button>
                    </div>
                </div>

                <div class="secondary-col">
                    <div class="sub-card radar-card">
                        <h3 data-i18n="series_profile_label"></h3>
                        <div id="radar-wrap"></div>
                        <div id="reliability-msg"></div>
                    </div>
                    <div class="sub-card">
                        <h3 data-i18n="interpretation_label"></h3>
                        <p id="interpretation-text"></p>
                    </div>
                    <div class="sub-card">
                        <h3 data-i18n="analysis_label"></h3>
                        <p id="recommendation-text"></p>
                    </div>
                </div>
            </div>
        </div>

        <div id="resume-modal" class="hidden modal-overlay">
            <div class="modal-content">
                <h3 data-i18n="resume_title"></h3>
                <p data-i18n="resume_msg"></p>
                <div class="modal-actions">
                    <button class="btn btn-cancel" onclick="app.discardProgress()" data-i18n="resume_no"></button>
                    <button class="btn btn-confirm" onclick="app.resumeProgress()" data-i18n="resume_yes"></button>
                </div>
            </div>
        </div>

        <div id="confirm-modal" class="hidden modal-overlay">
            <div class="modal-content">
                <h3 id="modal-title" data-i18n="modal_title"></h3>
                <p id="modal-message" data-i18n="modal_msg"></p>
                <div class="modal-actions">
                    <button class="btn btn-cancel" onclick="app.hideConfirm()" data-i18n="modal_cancel"></button>
                    <button class="btn btn-confirm" onclick="app.forceEnd()" data-i18n="modal_confirm"></button>
                </div>
            </div>
        </div>

    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <a href="https://www.anish7.me" target="_blank" class="footer-brand">Xeven</a>
            <a id="wiki-link" data-i18n-href="wiki_url" href="" target="_blank" class="footer-brand">2026</a>
            <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" class="footer-link">GPLv3+</a>
        </div>
    </footer>

</body>

<script src="translations.js"></script>
<script src="answers.js"></script>
<script src="script.js"></script>

</html>
